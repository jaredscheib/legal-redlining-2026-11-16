name: ci
# Run once per merge, by hand, after `make check` passes locally: gh workflow run ci.yml --ref <branch>
# Actions minutes are paid: keep every cap below.
on:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make check
        env:
          LLM_MODE: replay
